spring:
  application:
    name: cloudlab-copilot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudlab}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

  servlet:
    multipart:
      max-file-size: ${APP_SECURITY_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_SECURITY_MULTIPART_MAX_REQUEST_SIZE:100MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 8192

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
      allow-credentials: ${APP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
      allowed-methods: ${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${APP_SECURITY_CORS_ALLOWED_HEADERS:*}
      max-age: ${APP_SECURITY_CORS_MAX_AGE:3600}
    multipart:
      max-file-size: ${APP_SECURITY_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_SECURITY_MULTIPART_MAX_REQUEST_SIZE:100MB}
